<!-- Supabase → Authentication → Emails → Templates → Reset Password
     Subject（主题）：Reset your Sunny Closet password -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#171717">
  <p style="font-size:20px;font-weight:900;letter-spacing:0.2em">SUNNY CLOSET</p>
  <p>Click the button below to set a new password. The link works once and expires in 1 hour.</p>
  <p style="margin:28px 0">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
       style="background:#171717;color:#fff;padding:12px 28px;border-radius:999px;text-decoration:none;font-weight:700">
      Reset password
    </a>
  </p>
  <p style="font-size:12px;color:#737373">If you didn't request this, you can ignore this email — your password won't change.</p>
</div>
