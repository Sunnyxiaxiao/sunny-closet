# Supabase pauses free projects after 7 days without activity.
# This pings the public REST API every 3 days so the project stays awake while the site has no traffic.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/settings?select=max_rental_days" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -o /dev/null
          echo "Supabase responded"
